# dsh bundle layer: mount the yuyi communication seam on the host plane.
# The package's dsh.client declaration serves the browser half (the Yuyi
# tab and the Settings section) from this same row. The service stays
# dormant until hub and token resolve (config below, the YUYI_HUB/YUYI_TOKEN
# environment, or ~/.yuyi/env — the file the Yuyi installer writes). Model
# tools ride agent presets instead of this layer: see presets/yuyi.cordis.yml.
- insert:
    - id: yuyi
      name: dsh-yuyi
      # config:
      #   hub: ws://127.0.0.1:7377
      #   tokenEnv: YUYI_TOKEN
      #   device: my-dev-box
      #   replyTimeoutMs: 300000
